<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tables Review</title>

    <style type="text/css">
        table{
            border: 1px solid black;

            th, td{
              border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
        <th>State</th>
    </tr>

    <tr>
        <td>Wil</td>
        <td>20</td>
        <td>Chicago</td>
        <td>IL</td>
    </tr>

    <tr>
        <td>Alex</td>
        <td>20</td>
        <td>Minneapolis</td>
        <td>MN</td>
    </tr>
</table>

</body>
</html>
